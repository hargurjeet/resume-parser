name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push only current snapshot (no history) to avoid HF rejecting
          # binary files that exist in older commits
          git checkout --orphan hf-sync
          git add -A
          git commit -m "Sync from GitHub"
          git push https://Hargurjeet:${HF_TOKEN}@huggingface.co/spaces/Hargurjeet/Resume_parser hf-sync:main --force
